<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Glitch — Autonomous Multi-Agent Studio</title>
  
  <!-- Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM, Framer Motion 10, Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Dark Obsidian Liquid Glass Single-Viewport System */
    :root {
      --bg-canvas: #080c14;
      --glass-panel: rgba(15, 23, 42, 0.75);
      --glass-card: rgba(18, 28, 51, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-highlight: rgba(255, 255, 255, 0.16);
      --glass-shadow: 0 16px 40px -15px rgba(0, 0, 0, 0.6);
      --glass-inner-light: inset 0 1px 1px 0 rgba(255, 255, 255, 0.1);
    }

    html, body {
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      background-color: var(--bg-canvas);
      color: #f1f5f9;
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      padding: 0;
    }

    /* Ambient Liquid Mesh Background Glows */
    .ambient-mesh {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: -1;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 9999px;
      filter: blur(100px);
      opacity: 0.30;
      animation: floatOrb 24s ease-in-out infinite alternate;
    }

    .orb-1 {
      top: -10%;
      left: 10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(99, 102, 241, 0) 70%);
      animation-duration: 20s;
    }

    .orb-2 {
      top: 20%;
      right: -5%;
      width: 550px;
      height: 550px;
      background: radial-gradient(circle, rgba(14, 165, 233, 0.28) 0%, rgba(14, 165, 233, 0) 70%);
      animation-duration: 25s;
    }

    .orb-3 {
      bottom: -10%;
      left: 30%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(244, 63, 94, 0.20) 0%, rgba(244, 63, 94, 0) 70%);
      animation-duration: 28s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(30px, -20px) scale(1.06); }
      100% { transform: translate(-25px, 25px) scale(0.96); }
    }

    /* Liquid Glass Panels */
    .liquid-glass {
      background: var(--glass-panel);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-highlight);
      box-shadow: var(--glass-shadow), var(--glass-inner-light);
      border-radius: 16px;
    }

    .liquid-glass-card {
      background: var(--glass-card);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-top: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 12px;
    }

    /* Buttons */
    .liquid-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-top: 1px solid rgba(255, 255, 255, 0.18);
      color: #e2e8f0;
      box-shadow: 0 4px 10px -2px rgba(0, 0, 0, 0.3);
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.22);
    }

    .liquid-btn-primary {
      background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #4338ca 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 20px -4px rgba(79, 70, 229, 0.45);
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .liquid-btn-primary:hover {
      background: linear-gradient(135deg, #4338ca 0%, #4f46e5 50%, #3730a3 100%);
      transform: translateY(-1px);
    }

    .liquid-btn-emerald {
      background: linear-gradient(135deg, #059669 0%, #10b981 50%, #047857 100%);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-top: 1px solid rgba(255, 255, 255, 0.45);
      box-shadow: 0 8px 20px -4px rgba(16, 185, 129, 0.4);
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .glass-input {
      background: rgba(11, 18, 33, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #f1f5f9;
      border-radius: 10px;
    }
    .glass-input:focus {
      background: rgba(15, 23, 42, 0.95);
      border-color: #6366f1;
      outline: none;
    }

    /* Custom Scrollbar for inner components */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="p-2 sm:p-2.5 antialiased selection:bg-indigo-600 selection:text-white flex flex-col h-screen max-h-screen">
  <!-- Ambient Liquid Glows -->
  <div class="ambient-mesh">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
  </div>

  <div id="root" class="h-full flex flex-col min-h-0"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const { motion, AnimatePresence } = window.Motion;

    function App() {
      const [liveState, setLiveState] = useState(null);
      const [candidates, setCandidates] = useState([]);
      const [clips, setClips] = useState([]);
      const [queue, setQueue] = useState([]);
      const [published, setPublished] = useState([]);
      const [selectedVideo, setSelectedVideo] = useState("clip_1_ULTRA_MEME_SATURATED.mp4");
      const [isMuted, setIsMuted] = useState(true);
      const [isShaking, setIsShaking] = useState(false);
      const [showRadarModal, setShowRadarModal] = useState(false);
      const [actionLoading, setActionLoading] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);
      const [activeTab, setActiveTab] = useState('published');

      // Custom Prompt State (Intelligent Dynamic Trend Engine)
      const [promptText, setPromptText] = useState("Scan #1 viral breakout trends dynamically. If gaming/streamer: apply clean 60FPS split-screen facecam, focused scream zoom, and audio ducking without random memes. If movie/cinema: apply cinematic soundtrack, high-contrast grade, and epic trailer climax pacing.");
      const [topicFocus, setTopicFocus] = useState("dynamic_trends");

      const videoRef = useRef(null);

      // Fetch live real data
      const refreshData = async () => {
        try {
          const res = await fetch('/api/live_state');
          if (res.ok) {
            const data = await res.json();
            setLiveState(data);
            if (data.custom_prompt) setPromptText(data.custom_prompt);
            if (data.topic_focus) setTopicFocus(data.topic_focus);
            if (data.video_file && !selectedVideo) {
              setSelectedVideo(data.video_file);
            }
          }
        } catch (e) {
          console.error("Live state poll error:", e);
        }
      };

      const fetchExtendedData = async () => {
        try {
          const [candRes, clipRes, queueRes, pubRes] = await Promise.all([
            fetch('/api/candidates'),
            fetch('/api/clips'),
            fetch('/api/queue'),
            fetch('/api/published')
          ]);
          if (candRes.ok) setCandidates(await candRes.json());
          if (clipRes.ok) setClips(await clipRes.json());
          if (queueRes.ok) setQueue(await queueRes.json());
          if (pubRes.ok) setPublished(await pubRes.json());
        } catch (e) {
          console.error("Extended data error:", e);
        }
      };

      useEffect(() => {
        refreshData();
        fetchExtendedData();
        const interval = setInterval(refreshData, 2000);
        return () => clearInterval(interval);
      }, []);

      const triggerAction = async (actionName, payload = {}) => {
        setActionLoading(true);
        try {
          const res = await fetch('/api/action', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: actionName, ...payload })
          });
          const result = await res.json();
          setToastMsg(result.message || "Action executed successfully");
          setTimeout(() => setToastMsg(null), 3500);
          refreshData();
          fetchExtendedData();
        } catch (e) {
          setToastMsg("Execution failed: " + e.message);
          setTimeout(() => setToastMsg(null), 3500);
        } finally {
          setActionLoading(false);
        }
      };

      const savePromptDirection = () => {
        triggerAction("save_prompt", { notes: promptText, category: topicFocus });
      };

      const toggleSound = () => {
        if (videoRef.current) {
          videoRef.current.muted = !videoRef.current.muted;
          setIsMuted(videoRef.current.muted);
        }
      };

      const replayVideo = () => {
        if (videoRef.current) {
          videoRef.current.currentTime = 0;
          videoRef.current.play();
        }
      };

      const testShake = () => {
        setIsShaking(true);
        setTimeout(() => setIsShaking(false), 900);
      };

      // Real Data Calculations
      const channelTitle = liveState?.channel_info?.channel_title || "Clivox";
      const channelId = liveState?.channel_info?.channel_id || "UCk8rHfFBIOh80mBOovlWCwA";
      const channelHandle = liveState?.channel_info?.custom_url || "@clivox-era";
      const totalCandidatesCount = liveState?.total_candidates || candidates.length || 50;
      const totalClipsCount = liveState?.total_clips || clips.length || 8;
      const totalQueueCount = liveState?.total_queue || queue.length || 8;
      const publishedToday = liveState?.published_today ?? 1;
      const isParallelActive = liveState?.is_active || false;
      const parallelProgress = liveState?.progress || 0;
      const storageMb = liveState?.storage_stats?.clips_storage_mb || "387.67";

      // Real Virality Scores from latest clip
      const realVirality = liveState?.virality_score || 93.0;
      const realHook = liveState?.hook_quality || 92.0;

      const agents = liveState?.agents || {
        scout: { name: "Agent Scout", role: "Stream Radar", status: "idle", task: "50 Streams in Radar | Top: IShowSpeed" },
        clipper: { name: "Agent Clipper", role: "CV Split & Crop", status: "idle", task: "1080x1920 @ 60 FPS | Slicing 9:16 Split" },
        meme: { name: "Agent Meme VFX", role: "Hard Edit & SFX", status: "idle", task: "Vine Boom + Wasted + Phonk Ducking (-40%)" },
        antigravity: { name: "Antigravity AI (Brain)", role: "Autonomous Director & LLM", status: "idle", task: "Autonomous Director & LLM | Hook: 94.0" },
        uploader: { name: "Agent Clivox", role: "YouTube Dispatcher", status: "idle", task: "Channel Clivox: 1/3 Today | 4h Spacing Lock" }
      };

      return (
        <div className="h-full flex flex-col space-y-2 max-w-[1720px] mx-auto w-full">
          {/* Toast Notification */}
          <AnimatePresence>
            {toastMsg && (
              <motion.div 
                initial={{ opacity: 0, y: -15, scale: 0.95 }}
                animate={{ opacity: 1, y: 0, scale: 1 }}
                exit={{ opacity: 0, y: -15, scale: 0.95 }}
                className="fixed top-4 right-4 z-50 px-4 py-2.5 bg-slate-900 text-white text-xs font-semibold rounded-xl shadow-2xl backdrop-blur-xl border border-slate-700 flex items-center gap-2.5"
              >
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                <span>{toastMsg}</span>
              </motion.div>
            )}
          </AnimatePresence>

          {/* 1. Header Bar (Single-Viewport Compact: ~48px) */}
          <header className="liquid-glass px-3 py-2 flex items-center justify-between gap-3 shrink-0">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-600 to-sky-400 flex items-center justify-center text-white shadow-md shadow-indigo-500/20 border border-white/20">
                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
              </div>
              <div className="flex items-center gap-2">
                <h1 className="text-sm sm:text-base font-black tracking-tight text-white">
                  MONEY GLITCH <span className="text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-300">STUDIO</span>
                </h1>
                <span className="px-2 py-0.5 text-[9px] font-extrabold uppercase tracking-wider bg-indigo-500/15 text-indigo-300 rounded-full border border-indigo-500/30">
                  DIRECTED BY ANTIGRAVITY AI
                </span>
              </div>
            </div>

            {/* Header Actions & Live Status */}
            <div className="flex items-center gap-2 text-xs">
              <div className="flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-slate-900/80 border border-slate-700/80">
                <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span className="font-bold text-slate-300 text-[11px]">{channelTitle} ({channelHandle})</span>
                <span className="text-[9px] font-bold px-1.5 py-0.2 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                  {publishedToday}/3 Published
                </span>
              </div>

              {/* Clean Storage Button */}
              <button 
                onClick={() => triggerAction("purge_storage")}
                disabled={actionLoading}
                className="liquid-btn px-2.5 py-1 text-[11px] font-bold flex items-center gap-1 text-slate-300 hover:text-white"
                title="Auto-delete raw stream chunks and keep storage clean"
              >
                <svg className="w-3 h-3 text-rose-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.2">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
                <span>Clean ({storageMb} MB)</span>
              </button>

              {/* Trigger Swarm */}
              <button 
                onClick={() => triggerAction("run_cycle")}
                disabled={actionLoading}
                className="liquid-btn-primary px-3 py-1 text-[11px] font-bold flex items-center gap-1.5"
              >
                <svg className={`w-3 h-3 ${isParallelActive ? 'animate-spin' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                <span>{isParallelActive ? `Swarm (${parallelProgress}%)` : "Trigger Swarm"}</span>
              </button>

              {/* Direct Upload */}
              <button 
                onClick={() => triggerAction("trigger_actual_upload")}
                disabled={actionLoading}
                className="liquid-btn-emerald px-3 py-1 text-[11px] font-bold flex items-center gap-1.5"
              >
                <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
                <span>Upload to Clivox</span>
              </button>
            </div>
          </header>

          {/* 2. Main Single-Viewport 3-Column Studio Grid (100vh Fill, Zero Scroll) */}
          <main className="grid grid-cols-12 gap-2.5 flex-1 min-h-0 items-stretch">
            
            {/* ============================================================== */}
            {/* COLUMN 1 (LEFT - 3 COLS): COMPACT 9:16 SMARTPHONE SHOWCASE     */}
            {/* ============================================================== */}
            <section className="col-span-3 liquid-glass p-2.5 flex flex-col justify-between overflow-hidden">
              {/* Header & Controls */}
              <div className="space-y-1.5">
                <div className="flex items-center justify-between border-b border-slate-700/60 pb-1.5">
                  <span className="text-[10px] font-black uppercase tracking-wider text-slate-300 flex items-center gap-1.5">
                    <span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                    9:16 VERTICAL SHOWCASE
                  </span>
                  <div className="flex items-center gap-1">
                    <button 
                      onClick={toggleSound}
                      className="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] font-bold text-slate-300 hover:text-white border border-slate-700"
                    >
                      {isMuted ? "Unmute" : "Sound ON"}
                    </button>
                    <button 
                      onClick={replayVideo}
                      className="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] font-bold text-slate-300 hover:text-white border border-slate-700"
                    >
                      ↻
                    </button>
                  </div>
                </div>

                {/* Video Switcher Dropdown */}
                <select 
                  value={selectedVideo}
                  onChange={(e) => setSelectedVideo(e.target.value)}
                  className="w-full px-2 py-1 text-[11px] font-semibold rounded-lg bg-slate-900 border border-slate-700 text-slate-200"
                >
                  <option value="clip_1_ULTRA_MEME_SATURATED.mp4">clip_1_ULTRA_MEME (Speed GTA 6 Climax)</option>
                  <option value="short_35KDnej1hlI_1_5s.mp4">short_35KDnej1hlI (He Broke GTA 6)</option>
                  <option value="short_G3KoTo4ozEw_2_35s.mp4">short_G3KoTo4ozEw (Wait Till The End)</option>
                  <option value="speed_gta6_pro_edit.mp4">speed_gta6_pro_edit (Facecam 60FPS)</option>
                </select>
              </div>

              {/* Compact Smartphone Mockup (Fits in viewport) */}
              <div className="relative mx-auto w-full max-w-[210px] aspect-[9/16] rounded-[24px] bg-black p-1.5 shadow-xl border-2 border-slate-800 my-1 overflow-hidden">
                <div className={`w-full h-full rounded-[18px] overflow-hidden bg-black relative ${isShaking ? 'animate-bounce' : ''}`}>
                  <video
                    ref={videoRef}
                    key={selectedVideo}
                    src={`/video/${selectedVideo}`}
                    autoPlay
                    loop
                    muted={isMuted}
                    playsInline
                    className="w-full h-full object-cover"
                  />
                  {/* Climax Tag */}
                  <div className="absolute top-4 left-2 right-2 pointer-events-none">
                    <div className="bg-yellow-400 text-black font-black text-[8px] px-1.5 py-0.2 rounded text-center uppercase">
                      WAIT TILL THE END
                    </div>
                  </div>
                  {/* Hook text */}
                  <div className="absolute bottom-2 left-1.5 right-1.5 pointer-events-none">
                    <div className="bg-black/85 text-white text-[8px] p-1 rounded border border-white/20 text-center font-bold truncate">
                      {liveState?.current_clip_title || "HE ACTUALLY BROKE GTA 6!"}
                    </div>
                  </div>
                </div>
              </div>

              {/* Footer Credentials & Shake Button */}
              <div className="space-y-1 text-[10px] font-mono border-t border-slate-700/60 pt-1.5">
                <div className="flex justify-between text-slate-400">
                  <span>Channel:</span>
                  <span className="font-bold text-white truncate max-w-[120px]">{channelTitle} ({channelHandle})</span>
                </div>
                <div className="flex justify-between text-slate-400">
                  <span>Pacing Guard:</span>
                  <span className="font-bold text-emerald-400">4h Safe Lock Active</span>
                </div>
                <button 
                  onClick={testShake}
                  className="liquid-btn w-full py-1 text-[10px] font-bold text-rose-300 hover:text-white"
                >
                  Test Screen Shake Effect
                </button>
              </div>
            </section>

            {/* ============================================================== */}
            {/* COLUMN 2 (CENTER - 6 COLS): TIMELINE & 5 PARALLEL AGENTS       */}
            {/* ============================================================== */}
            <section className="col-span-6 flex flex-col justify-between space-y-2 h-full min-h-0">
              
              {/* NLE Timeline with 5 Autonomous Moving Cursors */}
              <div className="liquid-glass p-2.5 space-y-1.5 flex-1 flex flex-col justify-between min-h-0">
                <div className="flex items-center justify-between border-b border-slate-700/60 pb-1 shrink-0">
                  <div className="flex items-center gap-1.5">
                    <div className="w-2 h-2 rounded-full bg-cyan-400 animate-ping"></div>
                    <span className="text-[10px] font-black uppercase tracking-wider text-slate-200">
                      MULTI-TRACK TIMELINE & 5 AUTONOMOUS CURSORS
                    </span>
                  </div>
                  <div className="flex items-center gap-1.5">
                    <span className="text-[9px] font-mono text-emerald-400 font-bold bg-emerald-500/10 px-1.5 py-0.5 rounded border border-emerald-500/30 flex items-center gap-1">
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                      LIVE DRAG & EDIT ACTIVE
                    </span>
                    <span className="text-[9px] font-mono text-cyan-400 font-bold bg-cyan-500/10 px-1.5 py-0.5 rounded border border-cyan-500/30">
                      5 THREADS CONCURRENT
                    </span>
                  </div>
                </div>

                {/* Timeline Ruler */}
                <div className="h-5 bg-slate-900/90 rounded px-2 flex items-center justify-between text-[8px] font-mono text-slate-500 border border-slate-800 shrink-0">
                  <span>00:00s</span>
                  <span>00:05s</span>
                  <span className="text-amber-400 font-bold">00:14s (CLIMAX)</span>
                  <span>00:22s (WASTED)</span>
                  <span>00:30s</span>
                  <span>00:35s</span>
                </div>

                {/* The 5 Tracks with Cursors Directly On Them */}
                <div className="relative bg-slate-950/90 rounded-lg p-1.5 space-y-1.5 border border-slate-800 flex-1 flex flex-col justify-around overflow-hidden">

                    className="glass-input w-full p-2 text-[10px] font-medium text-slate-100 placeholder-slate-500 resize-none"
                  />

                  {/* Quick Directives */}
                  <div className="flex flex-wrap gap-1">
                    {[
                      "+ Movie Trailer",
                      "+ Cinematic Score",
                      "+ Scream Zoom",
                      "+ Split 60FPS",
                      "+ No Memes"
                    ].map(chip => (
                      <button
                        key={chip}
                        onClick={() => setPromptText(prev => prev + " " + chip.replace("+ ", ""))}
                        className="liquid-btn px-1.5 py-0.2 text-[8px] font-semibold text-slate-300 hover:text-white"
                      >
                        {chip}
                      </button>
                    ))}
                  </div>

                  <button
                    onClick={savePromptDirection}
                    disabled={actionLoading}
                    className="liquid-btn-primary w-full py-1 text-[10px] font-black flex items-center justify-center gap-1.5"
                  >
                    <span>Save & Apply AI Direction</span>
                  </button>
                </div>
              </div>

              {/* Middle: 100% Real Video Spec Deck */}
              <div className="liquid-glass-card p-2 space-y-1 my-1 text-[10px] font-mono">
                <div className="flex justify-between text-slate-400 border-b border-slate-700/50 pb-0.5">
                  <span className="font-bold text-slate-300">ENCODING SPECS</span>
                  <span className="text-emerald-400 font-bold">FFPROBE</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Resolution:</span>
                  <span className="font-bold text-white">1080x1920 (9:16)</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Frame Rate:</span>
                  <span className="font-bold text-emerald-400">60.00 FPS</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Bitrate:</span>
                  <span className="font-bold text-slate-200">5,167 kbps</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Virality Score:</span>
                  <span className="font-bold text-indigo-400">{realVirality} / 100</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-400">Profit Split:</span>
                  <span className="font-bold text-emerald-400">50/50 Active</span>
                </div>
              </div>

              {/* Bottom: Published & Vault Queue Tabs */}
              <div className="space-y-1">
                <div className="flex items-center justify-between text-[10px] font-bold border-b border-slate-700/60 pb-1">
                  <div className="flex gap-1">
                    <button 
                      onClick={() => setActiveTab('published')}
                      className={`px-2 py-0.5 rounded text-[9px] font-bold ${activeTab === 'published' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      Published ({published.length || 1})
                    </button>
                    <button 
                      onClick={() => setActiveTab('queue')}
                      className={`px-2 py-0.5 rounded text-[9px] font-bold ${activeTab === 'queue' ? 'bg-indigo-600 text-white' : 'text-slate-400'}`}
                    >
                      Queue ({totalQueueCount})
                    </button>
                  </div>
                  <button 
                    onClick={() => setShowRadarModal(true)}
                    className="text-[9px] text-cyan-400 font-bold hover:underline"
                  >
                    Radar ({totalCandidatesCount})
                  </button>
                </div>

                {/* Published Item */}
                {activeTab === 'published' && (
                  <div className="p-1.5 rounded-lg bg-slate-900/90 border border-slate-800 flex items-center justify-between gap-1 text-[9px]">
                    <div className="min-w-0">
                      <span className="font-extrabold text-emerald-400 uppercase text-[8px] block">LIVE ON YOUTUBE</span>
                      <h6 className="font-bold text-slate-200 truncate">WAIT TILL THE END IN TRENDS!</h6>
                    </div>
                    <a 
                      href="https://www.youtube.com/shorts/xGXXPooGYvo" 
                      target="_blank" 
                      rel="noopener noreferrer"
                      className="liquid-btn-emerald px-2 py-0.5 text-[9px] font-bold shrink-0"
                    >
                      View
                    </a>
                  </div>
                )}

                {/* Queue Items */}
                {activeTab === 'queue' && (
                  <div className="max-h-[55px] overflow-y-auto space-y-1 text-[9px]">
                    {clips.slice(0, 3).map(c => (
                      <div key={c.id} className="p-1 rounded bg-slate-900/80 border border-slate-800 flex justify-between">
                        <span className="truncate text-slate-300">{c.title}</span>
                        <span className="text-indigo-400 font-mono font-bold shrink-0 ml-1">{c.virality_score}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </section>
          </main>

          {/* Modal: 50 Scraped Streams in Radar Vault */}
          <AnimatePresence>
            {showRadarModal && (
              <motion.div 
                initial={{ opacity: 0 }}
                animate={{ opacity: 1 }}
                exit={{ opacity: 0 }}
                className="fixed inset-0 z-50 bg-black/80 backdrop-blur-md flex items-center justify-center p-4"
              >
                <motion.div 
                  initial={{ scale: 0.95, y: 15 }}
                  animate={{ scale: 1, y: 0 }}
                  exit={{ scale: 0.95, y: 15 }}
                  className="liquid-glass bg-slate-950/95 max-w-3xl w-full max-h-[80vh] flex flex-col p-4 space-y-3 border border-slate-700"
                >
                  <div className="flex items-center justify-between border-b border-slate-800 pb-2">
                    <h3 className="text-sm font-black text-white">
                      Agent Scout Radar Vault — 50 Scraped Streams
                    </h3>
                    <button 
                      onClick={() => setShowRadarModal(false)}
                      className="liquid-btn px-3 py-1 text-xs font-bold text-slate-300"
                    >
                      Close ✕
                    </button>
                  </div>

                  <div className="overflow-y-auto space-y-1.5 flex-1 pr-1">
                    {candidates.slice(0, 25).map((cand, idx) => (
                      <div key={cand.video_id || idx} className="p-2 rounded-lg bg-slate-900/80 border border-slate-800 flex items-center justify-between gap-3 text-xs">
                        <div className="min-w-0">
                          <h4 className="font-bold text-slate-200 truncate text-[11px]">{cand.title}</h4>
                          <div className="flex items-center gap-2 text-[10px] text-slate-400">
                            <span className="font-semibold text-indigo-400">{cand.channel_title}</span>
                            <span>•</span>
                            <span className="font-mono">{Number(cand.view_count || 0).toLocaleString()} views</span>
                          </div>
                        </div>
                        <a 
                          href={cand.url} 
                          target="_blank" 
                          rel="noopener noreferrer"
                          className="liquid-btn px-2.5 py-0.5 text-[10px] font-bold text-slate-300 shrink-0"
                        >
                          Source
                        </a>
                      </div>
                    ))}
                  </div>
                </motion.div>
              </motion.div>
            )}
          </AnimatePresence>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
