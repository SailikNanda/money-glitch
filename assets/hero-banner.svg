<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="40%" stop-color="#0b1324" />
      <stop offset="70%" stop-color="#051412" />
      <stop offset="100%" stop-color="#040810" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="agyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Banner Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bannerBg)" />
  <rect width="1196" height="416" x="2" y="2" rx="22" fill="none" stroke="#1e293b" stroke-width="2" />
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.35">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="200" y1="0" x2="200" y2="420" />
    <line x1="400" y1="0" x2="400" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="800" y1="0" x2="800" y2="420" />
    <line x1="1000" y1="0" x2="1000" y2="420" />
  </g>

  <!-- Top Ambient Glow Orbs -->
  <circle cx="280" cy="80" r="140" fill="#10B981" fill-opacity="0.12" filter="url(#glowGreen)" />
  <circle cx="920" cy="80" r="160" fill="#6366F1" fill-opacity="0.15" filter="url(#glowBlue)" />

  <!-- LEFT: Money Glitch Logo Icon -->
  <g transform="translate(130, 205)">
    <!-- Circuit rings -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.3" />
    <!-- Glitch diamond -->
    <g transform="rotate(45)">
      <rect x="-48" y="-48" width="96" height="96" rx="22" fill="#041f17" stroke="url(#neonGreen)" stroke-width="8" filter="url(#glowGreen)" />
    </g>
    <!-- Glitch cut lines -->
    <rect x="-60" y="-12" width="40" height="4" fill="#00FFA3" filter="url(#glowGreen)" />
    <rect x="20" y="14" width="45" height="4" fill="#06B6D4" filter="url(#glowGreen)" />
    <!-- Center '$' -->
    <text x="0" y="22" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#00FFA3" text-anchor="middle" filter="url(#glowGreen)">$</text>
    <text x="0" y="22" font-family="'Impact', 'Arial Black', sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>
  </g>

  <!-- CENTER: Typography & Branding -->
  <g transform="translate(260, 0)">
    <!-- Category Pill -->
    <rect x="0" y="70" width="310" height="28" rx="14" fill="#10b981" fill-opacity="0.12" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="14" cy="84" r="4.5" fill="#00FFA3" filter="url(#glowGreen)" />
    <text x="26" y="89" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#34D399" letter-spacing="1.5">AUTONOMOUS YOUTUBE SHORTS STUDIO</text>

    <!-- Main Title -->
    <text x="0" y="150" font-family="'Impact', 'Arial Black', sans-serif" font-size="54" font-weight="900" fill="#FFFFFF" letter-spacing="1">
      MONEY GLITCH <tspan fill="url(#neonGreen)">STUDIO</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#94A3B8">
      Zero-Touch Turnkey Media House <tspan fill="#CBD5E1">•</tspan> Directed Exclusively by <tspan fill="#818CF8" font-weight="700">Google Antigravity</tspan>
    </text>

    <!-- Key Feature Badges Grid -->
    <g transform="translate(0, 240)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="155" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F1F5F9">⚡ 1-Prompt Setup</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(165, 0)">
        <rect width="165" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">🌐 24 Live Verticals</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(340, 0)">
        <rect width="160" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A78BFA">🔄 Zigzag Rotation</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(510, 0)">
        <rect width="160" height="40" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
        <text x="14" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34D399">🕒 5-Day Freshness</text>
      </g>
    </g>

    <!-- Bottom Status Text -->
    <text x="0" y="335" font-family="system-ui, monospace" font-size="12" fill="#64748B">
      [ENGINE: <tspan fill="#38BDF8">ANTIGRAVITY 2.0</tspan>]  •  [PACING: <tspan fill="#34D399">4h GUARD / MAX 3 DAY</tspan>]  •  [RESOLUTION: <tspan fill="#F8FAFC">1080x1920 @ 60FPS</tspan>]
    </text>
  </g>

  <!-- RIGHT: Antigravity AI Logo Icon -->
  <g transform="translate(1070, 205)">
    <!-- Quantum Orbit Ring 1 -->
    <ellipse cx="0" cy="0" rx="85" ry="30" fill="none" stroke="#38BDF8" stroke-width="2.5" transform="rotate(-30)" filter="url(#glowBlue)" opacity="0.8" />
    <!-- Quantum Orbit Ring 2 -->
    <ellipse cx="0" cy="0" rx="85" ry="30" fill="none" stroke="#EC4899" stroke-width="2.5" transform="rotate(40)" filter="url(#glowBlue)" opacity="0.8" />
    <!-- Core Sphere -->
    <circle cx="0" cy="0" r="42" fill="url(#agyBlue)" filter="url(#glowBlue)" />
    <!-- Antigravity Delta Glyph -->
    <path d="M 0 -22 L 20 14 L -20 14 Z" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round" />
    <circle cx="0" cy="-3" r="5" fill="#FFFFFF" />
    <!-- Satellite Node -->
    <circle cx="-65" cy="-40" r="5" fill="#38BDF8" filter="url(#glowBlue)" />
    <circle cx="68" cy="42" r="4.5" fill="#F43F5E" filter="url(#glowBlue)" />
  </g>
</svg>
