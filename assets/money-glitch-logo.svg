<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#051410" />
      <stop offset="100%" stop-color="#020807" />
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FFA3" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="glitchCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="glitchMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="intenseGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="22" result="blur2" />
      <feComposite in="SourceGraphic" in2="blur2" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="500" rx="100" fill="url(#bgGlow)" />
  <rect width="496" height="496" x="2" y="2" rx="98" fill="none" stroke="url(#neonGreen)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Outer Cyber Circuit Matrix -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 12" stroke-opacity="0.25" />
  <circle cx="250" cy="250" r="165" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="30 20 10 20" stroke-opacity="0.3" />

  <!-- Glitch Aberration Shadow Layers -->
  <!-- Magenta Offset -->
  <g transform="translate(244, 246) rotate(45)">
    <rect x="-85" y="-85" width="170" height="170" rx="36" fill="none" stroke="url(#glitchMagenta)" stroke-width="12" opacity="0.6" filter="url(#neonGlow)"/>
  </g>
  <!-- Cyan Offset -->
  <g transform="translate(256, 254) rotate(45)">
    <rect x="-85" y="-85" width="170" height="170" rx="36" fill="none" stroke="url(#glitchCyan)" stroke-width="12" opacity="0.7" filter="url(#neonGlow)"/>
  </g>

  <!-- Main Center Hologram Diamond -->
  <g transform="translate(250, 250) rotate(45)">
    <rect x="-85" y="-85" width="170" height="170" rx="36" fill="#041f17" fill-opacity="0.75" stroke="url(#neonGreen)" stroke-width="14" filter="url(#neonGlow)"/>
    <rect x="-70" y="-70" width="140" height="140" rx="26" fill="none" stroke="#00FFA3" stroke-width="3" stroke-opacity="0.6" />
  </g>

  <!-- Horizontal Glitch Cut Slices -->
  <rect x="110" y="210" width="110" height="6" fill="#00FFA3" filter="url(#neonGlow)" />
  <rect x="290" y="278" width="100" height="6" fill="#06B6D4" filter="url(#neonGlow)" />
  <rect x="150" y="325" width="60" height="4" fill="#EC4899" opacity="0.8" />
  <rect x="300" y="165" width="50" height="4" fill="#00FFA3" opacity="0.8" />

  <!-- Center Icon: Floating Cyber Glitch Currency & Voltage Bolt -->
  <!-- Glitch Shadow '$' -->
  <text x="246" y="292" font-family="'Impact', 'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#EC4899" text-anchor="middle" opacity="0.5">$</text>
  <text x="254" y="296" font-family="'Impact', 'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#06B6D4" text-anchor="middle" opacity="0.6">$</text>
  <!-- Main Neon '$' -->
  <text x="250" y="294" font-family="'Impact', 'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#00FFA3" text-anchor="middle" filter="url(#intenseGlow)">$</text>
  <text x="250" y="294" font-family="'Impact', 'Arial Black', sans-serif" font-size="120" font-weight="900" fill="#FFFFFF" text-anchor="middle">$</text>

  <!-- Kinetic Sparks & Particles -->
  <circle cx="160" cy="180" r="5" fill="#00FFA3" filter="url(#neonGlow)" />
  <circle cx="340" cy="330" r="4.5" fill="#06B6D4" filter="url(#neonGlow)" />
  <circle cx="360" cy="200" r="4" fill="#EC4899" filter="url(#neonGlow)" />
  <circle cx="140" cy="290" r="3.5" fill="#00FFA3" filter="url(#neonGlow)" />
</svg>
