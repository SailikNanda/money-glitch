<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="agyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="agyBlueViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="ringGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.9" />
    </linearGradient>
    <linearGradient id="ringGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F43F5E" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#A5B4FC" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#312E81" stop-opacity="0" />
    </radialGradient>
    <filter id="agyGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="orbShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container -->
  <rect width="500" height="500" rx="100" fill="url(#agyBg)" />
  <rect width="496" height="496" x="2" y="2" rx="98" fill="none" stroke="url(#agyBlueViolet)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Outer Quantum Orbits -->
  <g transform="translate(250, 250)">
    <!-- Orbit Ring 1 -->
    <ellipse cx="0" cy="0" rx="175" ry="60" fill="none" stroke="url(#ringGrad1)" stroke-width="4.5" transform="rotate(-30)" filter="url(#agyGlow)" />
    <!-- Orbit Ring 2 -->
    <ellipse cx="0" cy="0" rx="175" ry="60" fill="none" stroke="url(#ringGrad2)" stroke-width="4" transform="rotate(40)" filter="url(#agyGlow)" />
    <!-- Orbit Ring 3 (Equatorial) -->
    <ellipse cx="0" cy="0" rx="185" ry="45" fill="none" stroke="#60A5FA" stroke-width="2" stroke-dasharray="12 16" transform="rotate(85)" opacity="0.4" />

    <!-- Ambient Gravity Wave Halo -->
    <circle cx="0" cy="0" r="110" fill="url(#coreGlow)" opacity="0.45" />

    <!-- Antigravity Core Sphere -->
    <circle cx="0" cy="0" r="78" fill="url(#agyBlueViolet)" filter="url(#orbShadow)" />
    <circle cx="-18" cy="-20" r="64" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.4" />
    
    <!-- Inverted Gravity Apex Triangle (Antigravity 'A') -->
    <path d="M 0 -42 L 36 28 L -36 28 Z" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linejoin="round" filter="url(#agyGlow)" />
    <circle cx="0" cy="-6" r="10" fill="#FFFFFF" filter="url(#agyGlow)" />

    <!-- Quantum Orbit Nodes / Satellites -->
    <circle cx="-135" cy="-78" r="8" fill="#38BDF8" filter="url(#agyGlow)" />
    <circle cx="140" cy="82" r="7.5" fill="#F43F5E" filter="url(#agyGlow)" />
    <circle cx="115" cy="-95" r="6" fill="#C084FC" filter="url(#agyGlow)" />
    <circle cx="-110" cy="98" r="6.5" fill="#818CF8" filter="url(#agyGlow)" />
  </g>
</svg>
